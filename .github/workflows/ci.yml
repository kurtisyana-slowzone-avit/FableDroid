name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-checks:
    name: Offline checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check game version table
        run: python3 tools/generate_game_versions.py --check

      - name: Run Python unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Check SDK Android patch round-trip
        run: |
          git submodule update --init thirdparty/rexglue-sdk
          python3 tools/sdk_patch.py check

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Ensure Android SDK platform 35
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "ANDROID_SDK_ROOT/ANDROID_HOME is not set" >&2
            exit 1
          fi
          if [ ! -d "$SDK_ROOT/platforms/android-35" ]; then
            SDKMANAGER="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
            if [ -z "$SDKMANAGER" ]; then
              echo "sdkmanager not found under $SDK_ROOT" >&2
              exit 1
            fi
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" >/dev/null || true
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35"
          fi

      - name: Run Android launcher unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Validate MASTER_PLAN.md
        run: |
          if [ -f ".agents/skills/next-task/scripts/plan_tasks.py" ]; then
            python3 .agents/skills/next-task/scripts/plan_tasks.py validate
          else
            echo "Skipping plan_tasks.py validate (.agents/skills/next-task/scripts/plan_tasks.py not present)"
          fi
